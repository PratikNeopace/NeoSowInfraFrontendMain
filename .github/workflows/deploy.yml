name: Deploy Frontend to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Auto Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: SSH into Hostinger VPS and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            echo "🚀 Starting automated deployment on Hostinger VPS..."
            /home/neosowinfraa/deploy_frontend.sh
            echo "✅ Frontend successfully deployed to www.neosowinfra.com!"
