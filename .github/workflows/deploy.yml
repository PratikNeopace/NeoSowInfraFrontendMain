name: Deploy Frontend to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Auto Deploy on Hostinger VPS
    runs-on: self-hosted

    steps:
      - name: Run Local Deploy Script
        run: |
          echo "🚀 Starting automated deployment on Hostinger VPS..."
          /home/neosowinfraa/deploy_frontend.sh
          echo "✅ Frontend successfully deployed to www.neosowinfra.com!"
